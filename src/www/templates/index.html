<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title id="titleid">T.A.R.S.</title>

  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}?v=7.2" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/bootstrap-icons.css') }}?v=7.2" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/main.css') }}?v=7.4" rel="stylesheet">
  <link id="themeCSS" href="{{ url_for('static', filename='css/themes/' + (webui_theme or 'default') + '.css') }}?v=7.4" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/tars-v2.css') }}?v=8.0" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='imgs/favicon.ico') }}?v=7.2">

  <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}?v=7.2"></script>
  <script src="{{ url_for('static', filename='js/socket.io.js') }}?v=7.2"></script>
</head>

<body class="tars-v2-webui">
  <!-- slow-drifting nebula blobs (CSS only, behind everything) -->
  <div class="nebula-layer" aria-hidden="true">
    <div class="nebula-blob nb-1"></div>
    <div class="nebula-blob nb-2"></div>
    <div class="nebula-blob nb-3"></div>
  </div>
  <canvas id="particleBg"></canvas>
  <audio id="audioPlayer" controls hidden></audio>

  <!-- ── TAB BAR ── -->
  <nav class="tab-bar" id="myTab" role="tablist">
    <div class="v2-brand" aria-label="TARS remote operations">
      <div class="v2-brand-mark">TARS<span class="v2-brand-pips" aria-hidden="true">•••</span></div>
      <div class="v2-brand-copy">
        <span>REMOTE OPERATIONS</span>
        <small>TACTICAL CONTROL LINK</small>
      </div>
    </div>
    <div class="tab-bar-left">
      <button class="custom-tab active" id="chat-tab" data-bs-toggle="tab" data-bs-target="#chat" role="tab" aria-label="Chat"><i class="bi bi-chat-dots-fill"></i><span>CHAT</span></button>
      <button class="custom-tab" id="motion-tab" data-bs-toggle="tab" data-bs-target="#motion" role="tab" aria-label="Motion"><i class="bi bi-joystick"></i><span>MOTION</span></button>
      <button class="custom-tab" id="emotions-tab" data-bs-toggle="tab" data-bs-target="#emotions" role="tab" aria-label="Face"><i class="bi bi-emoji-smile"></i><span>FACE</span></button>
      <button class="custom-tab" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard" role="tab" aria-label="Dashboard"><i class="bi bi-graph-up"></i><span>STATUS</span></button>
      <button class="custom-tab" id="config-tab" data-bs-toggle="tab" data-bs-target="#config" role="tab" aria-label="Settings"><i class="bi bi-gear-fill"></i><span>SETTINGS</span></button>
    </div>
    <div class="tab-bar-right">
      <div class="v2-metric" title="CPU load"><span>CPU</span><strong id="v2HeaderCpu">--</strong></div>
      <div class="v2-metric" title="Memory use"><span>RAM</span><strong id="v2HeaderRam">--</strong></div>
      <div class="v2-metric" title="Processor temperature"><span>TEMP</span><strong id="v2HeaderTemp">--</strong></div>
      <div class="connection-indicator" id="connIndicator">
        <span class="conn-dot" id="connDot"></span>
        <span id="v2ConnectionText">LINKING</span>
      </div>
      <div class="v2-clock"><span id="v2Clock">--:--</span><small>LOCAL</small></div>
      <button class="custom-tab" id="fullscreen-toggle" onclick="toggleFullscreen()" aria-label="Fullscreen">
        <i class="bi bi-fullscreen" id="fullscreen-icon"></i>
      </button>
    </div>
  </nav>

  <div class="v2-mobile-command-bar">
    <div><strong>{{ char_name | e }}</strong><span>REMOTE</span></div>
    <div class="v2-mobile-link"><span class="v2-mobile-dot"></span><span id="v2MobileConnectionText">LINKING</span></div>
    <span id="v2MobileClock">--:--</span>
  </div>

  <!-- ── TAB CONTENT ── -->
  <div class="tab-content" id="myTabContent">
    <div class="swipe-track" id="swipeTrack">
      {% include 'tabs/chat.html' %}
      {% include 'tabs/motion.html' %}
      {% include 'tabs/emotions.html' %}
      {% include 'tabs/dashboard.html' %}
      {% include 'tabs/config.html' %}
    </div>
  </div>

  <!-- ── MOBILE BOTTOM NAV ── -->
  <nav class="mobile-nav" id="mobileNav">
    <div class="mobile-nav-buttons">
      <button class="mobile-nav-btn active" data-tab-index="0" aria-label="Chat"><i class="bi bi-chat-dots-fill"></i><span>Chat</span></button>
      <button class="mobile-nav-btn" data-tab-index="1" aria-label="Motion"><i class="bi bi-joystick"></i><span>Move</span></button>
      <button class="mobile-nav-btn" data-tab-index="2" aria-label="Emotions"><i class="bi bi-emoji-smile"></i><span>FACE</span></button>
      <button class="mobile-nav-btn" data-tab-index="3" aria-label="Dashboard"><i class="bi bi-graph-up"></i><span>Dash</span></button>
      <button class="mobile-nav-btn" data-tab-index="4" aria-label="Config"><i class="bi bi-gear-fill"></i><span>Config</span></button>
    </div>
  </nav>

  <!-- Toast notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Flask → JS bridge -->
  <script>
    window.APP_CONFIG = {
      charName:      {{ char_name | tojson }},
      charGreeting:  {{ char_greeting | tojson }},
      port:          {{ port | tojson }},
      charAvatarUrl: {{ url_for('static', filename='imgs/char.png') | tojson }},
      userName:      {{ user_name | tojson }}
    };
  </script>

  <script src="{{ url_for('static', filename='js/d3.v7.min.js') }}?v=7.4"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}?v=7.5"></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="{{ url_for('static', filename='js/tars_preview.js') }}?v=7.5"></script>
  <script src="{{ url_for('static', filename='js/particles.js') }}?v=7.4"></script>
  <script src="{{ url_for('static', filename='js/webui-v2.js') }}?v=8.0"></script>
</body>
</html>

name: Hardware-free release tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_QUICK_CONTROLS_STYLE: Basic
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release-test dependencies
        run: python -m pip install -r requirements-release-tests.txt
      - name: Run strict release suite
        run: python tools/run_release_tests.py --strict
